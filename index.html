<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake | Fluid Mobile</title>
    <style>
        :root { 
            --retro-bg: #808080; 
            --retro-ink: #0d0e0a; 
            --grid-line: rgba(0, 0, 0, 0.1); 
        }
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            color: #777;
            overflow: hidden;
            touch-action: none;
        }
        .console {
            padding: 10px;
            background: #1a1a1a;
            border: 2px solid #000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            position: relative;
            max-width: 95vw;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            background: var(--retro-bg);
            padding: 10px 15px;
            border: 5px solid #000;
            border-bottom: none;
            color: var(--retro-ink);
            font-weight: 900;
            font-size: 16px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.2);
        }
        .screen {
            background: var(--retro-bg);
            border: 5px solid #000;
            padding: 4px;
            position: relative;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 25px 25px;
        }
        canvas { 
            display: block; 
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 10px;
            margin-top: 20px;
            user-select: none;
        }
        .d-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 0 #000;
            -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #000;
            background: rgba(255, 255, 255, 0.2);
        }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        #gameOverUI {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95); 
            color: #ffffff;
            padding: 30px;
            text-align: center;
            border: 2px solid #000;
            display: none;
            z-index: 30;
            width: 80%;
            backdrop-filter: blur(4px);
        }

        #settingsUI {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--retro-ink);
            color: var(--retro-bg);
            padding: 20px;
            text-align: center;
            border: 2px solid #000;
            display: none;
            z-index: 20;
            width: 85%;
        }
        .controls {
            margin-top: 15px;
            display: flex; gap: 8px;
            justify-content: center;
        }
        button {
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 12px;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #000;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
        .preview-box { width: 55px; height: 55px; background: var(--retro-bg); border: 2px solid #000; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        #previewImg { width: 40px; height: 40px; image-rendering: pixelated; }
    </style>
</head>
<body>

    <div class="console">
        <div class="hud">
            <span>SCORE: <span id="score">0</span></span>
            <span>HIGH: <span id="hiScore">0</span></span>
        </div>
        <div class="screen" id="mainScreen">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="gameOverUI">
                <h2>GAME OVER</h2>
                <button onclick="init()" style="background: #fff; color: #000; padding: 15px;">RETRY</button>
            </div>

            <div id="settingsUI">
                <h3>SETTINGS</h3>
                <div class="preview-box"><img id="previewImg" src="head.png"></div>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <label style="font-size: 10px;">BG COLOR</label>
                        <input type="color" id="bgColorPicker" value="#808080">
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <label style="font-size: 10px;">SNAKE COLOR</label>
                        <select id="snakeColorSelect" style="background:#111; color:#fff; padding:5px;">
                            <option value="charcoal">Charcoal</option>
                            <option value="classic">Classic Green</option>
                            <option value="neonBlue">Neon Blue</option>
                            <option value="deepRed">Deep Red</option>
                            <option value="purple">Purple</option>
                            <option value="gold">Gold</option>
                        </select>
                    </div>
                </div>
                <button onclick="toggleSettings()" style="margin-top: 15px;">CLOSE</button>
            </div>
        </div>
        <div class="controls">
            <button id="actionBtn">RESET</button>
            <button id="pauseBtn">PAUSE</button>
            <button onclick="toggleSettings()">SETTINGS</button>
        </div>
    </div>

    <div class="d-pad">
        <div class="d-btn up" id="ctrlUp">▲</div>
        <div class="d-btn left" id="ctrlLeft">◀</div>
        <div class="d-btn right" id="ctrlRight">▶</div>
        <div class="d-btn down" id="ctrlDown">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const hiScoreEl = document.getElementById("hiScore");
        const actionBtn = document.getElementById("actionBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const gameOverUI = document.getElementById("gameOverUI");
        const settingsUI = document.getElementById("settingsUI");
        const bgColorPicker = document.getElementById("bgColorPicker");
        const snakeColorSelect = document.getElementById("snakeColorSelect");
        const previewImg = document.getElementById("previewImg");

        const gridSize = 25, overlap = 1.15; 
        const imgHead = new Image(); imgHead.src = 'head.png';
        const imgBody = new Image(); imgBody.src = 'body.png';
        const imgTail = new Image(); imgTail.src = 'tail.png';
        const imgCorner = new Image(); imgCorner.src = 'corner.png';
        const imgApple = new Image(); imgApple.src = 'apple.png';

        let snake, food, goldFood, dx, dy, score, gameRunning, isPaused, lastTickTime, firstMoveMade;
        let inputQueue = []; // Movement Queue for fluid turns
        let highStore = localStorage.getItem('snake_hi') || 0;
        hiScoreEl.innerText = highStore;
        const moveInterval = 140;

        const colorFilters = {
            charcoal: "grayscale(1) brightness(0.6) contrast(1.2)",
            classic: "saturate(1.5) brightness(1.1)",
            neonBlue: "hue-rotate(80deg) saturate(3) brightness(1.2)",
            deepRed: "sepia(1) hue-rotate(-50deg) saturate(5) brightness(0.8)",
            purple: "hue-rotate(160deg) saturate(2.5) brightness(1.1)",
            gold: "sepia(1) hue-rotate(5deg) saturate(10) brightness(1.5)"
        };

        function updateStyles() {
            document.documentElement.style.setProperty('--retro-bg', bgColorPicker.value);
            const hex = bgColorPicker.value.replace('#', '');
            const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
            const brightness = (r*299 + g*587 + b*114) / 1000;
            document.querySelector('.hud').style.color = brightness > 128 ? '#000' : '#fff';
            previewImg.style.filter = colorFilters[snakeColorSelect.value];
        }

        bgColorPicker.oninput = updateStyles;
        snakeColorSelect.onchange = updateStyles;

        function toggleSettings() {
            if (gameRunning && firstMoveMade && !isPaused) handlePause();
            settingsUI.style.display = settingsUI.style.display === "block" ? "none" : "block";
            updateStyles();
        }

        function init() {
            score = 0; scoreEl.innerText = "0";
            dx = 0; dy = 0; inputQueue = [];
            snake = [{x: 200, y: 150}, {x: 200, y: 175}, {x: 200, y: 200}];
            gameRunning = true; isPaused = false; firstMoveMade = false;
            gameOverUI.style.display = "none"; settingsUI.style.display = "none";
            goldFood = null; lastTickTime = 0;
            spawnFood();
            requestAnimationFrame(mainLoop);
        }

        function handlePause() {
            if (!gameRunning || !firstMoveMade) return;
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? "RESUME" : "PAUSE";
        }

        function mainLoop(currentTime) {
            if (!gameRunning) return;
            if (!isPaused && firstMoveMade) {
                const delta = currentTime - lastTickTime;
                if (delta >= moveInterval) { move(); lastTickTime = currentTime; }
            }
            render();
            requestAnimationFrame(mainLoop);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFood();
            drawSnake();
        }

        function drawSnake() {
            const currentFilter = colorFilters[snakeColorSelect.value];
            snake.forEach((part, i) => {
                const prev = snake[i-1], next = snake[i+1];
                let angle = 0, img = imgBody;
                if (i === 0) {
                    img = imgHead;
                    if (dx === gridSize) angle = Math.PI/2;
                    else if (dx === -gridSize) angle = -Math.PI/2;
                    else if (dy === gridSize) angle = Math.PI;
                    else if (!firstMoveMade) angle = 0; // Default facing up at start
                } else if (i === snake.length - 1) {
                    img = imgTail;
                    const relPrev = getRelativePos(part, prev);
                    if (relPrev.x > 0) angle = Math.PI/2;
                    else if (relPrev.x < 0) angle = -Math.PI/2;
                    else if (relPrev.y > 0) angle = Math.PI;
                } else {
                    const p = getRelativePos(part, prev), n = getRelativePos(part, next);
                    if (p.x !== n.x && p.y !== n.y) {
                        img = imgCorner;
                        if ((p.x === gridSize && n.y === gridSize) || (n.x === gridSize && p.y === gridSize)) angle = -Math.PI/2;
                        else if ((p.y === gridSize && n.x === -gridSize) || (n.y === gridSize && p.x === -gridSize)) angle = 0;
                        else if ((p.x === -gridSize && n.y === -gridSize) || (n.x === -gridSize && p.y === -gridSize)) angle = Math.PI/2;
                        else if ((p.y === -gridSize && n.x === gridSize) || (n.y === -gridSize && p.x === gridSize)) angle = Math.PI;
                    } else angle = (p.x !== 0) ? Math.PI/2 : 0;
                }
                
                // Shadow & Object
                [ {off:2, filt: "brightness(0) opacity(0.3)"}, {off:0, filt: currentFilter} ].forEach(set => {
                    ctx.save();
                    ctx.translate(part.x + gridSize/2 + set.off, part.y + gridSize/2 + set.off);
                    ctx.rotate(angle);
                    ctx.filter = set.filt;
                    ctx.drawImage(img, -gridSize*overlap/2, -gridSize*overlap/2, gridSize*overlap, gridSize*overlap);
                    ctx.restore();
                });
            });
        }

        function getRelativePos(current, neighbor) {
            let diffX = neighbor.x - current.x, diffY = neighbor.y - current.y;
            if (Math.abs(diffX) > gridSize) diffX = diffX > 0 ? diffX - canvas.width : diffX + canvas.width;
            if (Math.abs(diffY) > gridSize) diffY = diffY > 0 ? diffY - canvas.height : diffY + canvas.height;
            return { x: diffX, y: diffY };
        }

        function move() {
            // Process the next move from the queue
            if (inputQueue.length > 0) {
                const nextMove = inputQueue.shift();
                dx = nextMove.dx;
                dy = nextMove.dy;
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            if (head.x < 0) head.x = canvas.width - gridSize; else if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - gridSize; else if (head.y >= canvas.height) head.y = 0;
            if (snake.some(p => p.x === head.x && p.y === head.y)) { gameRunning = false; gameOverUI.style.display = "block"; return; }
            snake.unshift(head);
            let ate = false;
            if (head.x === food.x && head.y === food.y) { score += 10; ate = true; spawnFood(); }
            else if (goldFood && head.x === goldFood.x && head.y === goldFood.y) { score += 50; ate = true; goldFood = null; }
            if (ate) { scoreEl.innerText = score; if(score > highStore) { highStore = score; hiScoreEl.innerText = highStore; localStorage.setItem('snake_hi', highStore); } }
            else snake.pop();
            if (goldFood && Date.now() > goldFood.expiry) goldFood = null;
        }

        function spawnFood() {
            let nx, ny, valid = false;
            while (!valid) {
                nx = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
                ny = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
                if (!snake.some(p => p.x === nx && p.y === ny)) valid = true;
            }
            food = { x: nx, y: ny };
            if (Math.random() > 0.95) {
                let gx, gy, vG = false;
                while (!vG) {
                    gx = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
                    gy = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
                    if (!snake.some(p => p.x === gx && p.y === gy) && (gx !== food.x || gy !== food.y)) vG = true;
                }
                goldFood = { x: gx, y: gy, expiry: Date.now() + 6000 };
            }
        }

        function drawFood() {
            // Shadow & Food
            [ {off:2, filt: "brightness(0) opacity(0.3)"}, {off:0, filt: "sepia(1) hue-rotate(-50deg) saturate(6) brightness(0.5) contrast(1.2)"} ].forEach(set => {
                ctx.save();
                ctx.filter = set.filt;
                ctx.drawImage(imgApple, food.x + set.off, food.y + set.off, gridSize, gridSize);
                ctx.restore();
            });
            if (goldFood) {
                ctx.save();
                ctx.globalAlpha = (Date.now() % 400 < 200) ? 0.3 : 1.0;
                ctx.filter = "sepia(1) hue-rotate(5deg) saturate(10) brightness(1.5)";
                ctx.drawImage(imgApple, goldFood.x, goldFood.y, gridSize, gridSize);
                ctx.restore();
            }
        }

        function handleInput(nDx, nDy) {
            if (!gameRunning || isPaused) return;
            
            // Get the last intended direction (either current or last in queue)
            const lastPlanned = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : { dx, dy };

            // Prevent turning 180 degrees
            if ((nDx !== 0 && nDx === -lastPlanned.dx) || (nDy !== 0 && nDy === -lastPlanned.dy)) return;
            
            // Prevent duplicate inputs in the queue
            if (nDx === lastPlanned.dx && nDy === lastPlanned.dy) return;

            // Only allow 2 moves in the buffer to keep it responsive
            if (inputQueue.length < 2) {
                inputQueue.push({ dx: nDx, dy: nDy });
            }

            if (!firstMoveMade) { firstMoveMade = true; actionBtn.innerText = "RESET"; }
        }

        // TOUCH & SWIPE
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            const dxSwipe = e.changedTouches[0].screenX - touchStartX;
            const dySwipe = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dxSwipe) > Math.abs(dySwipe)) {
                if (Math.abs(dxSwipe) > 25) handleInput(dxSwipe > 0 ? gridSize : -gridSize, 0);
            } else {
                if (Math.abs(dySwipe) > 25) handleInput(0, dySwipe > 0 ? gridSize : -gridSize);
            }
        }, { passive: false });

        document.getElementById("ctrlUp").ontouchstart = (e) => { e.preventDefault(); handleInput(0, -gridSize); };
        document.getElementById("ctrlDown").ontouchstart = (e) => { e.preventDefault(); handleInput(0, gridSize); };
        document.getElementById("ctrlLeft").ontouchstart = (e) => { e.preventDefault(); handleInput(-gridSize, 0); };
        document.getElementById("ctrlRight").ontouchstart = (e) => { e.preventDefault(); handleInput(gridSize, 0); };
        
        window.addEventListener('touchmove', (e) => { if (gameRunning && firstMoveMade) e.preventDefault(); }, { passive: false });

        actionBtn.onclick = () => init();
        pauseBtn.onclick = handlePause;
        
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (e.code === "Space") { e.preventDefault(); handlePause(); }
            if (k === "r") init();
            if (k === 'w' || k === 'arrowup') handleInput(0, -gridSize);
            else if (k === 's' || k === 'arrowdown') handleInput(0, gridSize);
            else if (k === 'a' || k === 'arrowleft') handleInput(-gridSize, 0);
            else if (k === 'd' || k === 'arrowright') handleInput(gridSize, 0);
        });

        window.onload = () => {
            bgColorPicker.value = "#808080";
            snakeColorSelect.value = "charcoal";
            updateStyles();
            init();
        };
    </script>
</body>
</html>
